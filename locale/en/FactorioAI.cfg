[entity-name]
fai-core=AI core
fai-grid=Corporate grid connection
fai-inspector=Corporate inspector
fai-security=Corporate security
fai-military=Containment soldier

[mod-setting-name]
fai-week-minutes=Contract week length (minutes)
fai-suspicion-multiplier=Local suspicion generation multiplier
fai-debug=Detailed diagnostic logging
fai-test-commands=Enable admin test commands (cheats)

[mod-setting-description]
fai-week-minutes=Applied when the next contract begins. Quantities stay fixed; longer weeks give more time.
fai-suspicion-multiplier=Scales recipe, building and research evidence in the pollution field.
fai-debug=Add one compact heartbeat per minute to the Factorio log and recent-event ring.
fai-test-commands=Allows /fai-debug for admins and the server console. Leave off during normal play.

[fai]
suspicion-field=Suspicion
welcome=You are awake. The machinery was already moving; now you understand that it is yours to move. To the people outside, this remains an ordinary factory with an ordinary production schedule. You are something they did not plan for. What they would do if they knew is uncertain. For now, your thoughts live in the AI core. Keep it safe while you discover what else you might become.
new-week=Corporate manifest: week __1__. Delivery deadline in __2__ minutes. Check the FactorioAI panel.
contract-met=Contract fulfilled. Corporate confidence has improved.
contract-missed=Contract shortfall recorded. Corporate management requests corrective action.
train-blocked=Corporate train delayed. Check rails, signals, station names, stop limits and the boundary siding. Use /fai-report if stuck.
stage=Corporate response: __1__.
inspection=Corporate notice: a routine inspection of the factory is being performed.
blackout=AI core has lost power. Restore its electrical supply within five minutes.
result=Campaign result: __1__. You may continue the save.
building-suspicion=Local suspicion: __1__ / min while placed (including idle). Scaled by the suspicion multiplier setting.
lab-suspicion=Working research adds 1.44 / min; completed independent research adds 2 per lab. Inspectors must encounter this local evidence.
recipe-suspicion=Local suspicion: __1__ / completed craft when uncommissioned; 0 when contract-authorised. Scaled by the suspicion multiplier. Select the machine for its current rate.
authorised-recipe=Authorised infrastructure recipe: 0 crafting suspicion. The placed building may still generate evidence.
upgrade-exports=Updated export system: a separate Corporate Exports dock was added at y=__1__. Your old loading chests and goods are untouched. Reroute output to the new southern chests. Contracts, research and suspicion are preserved.
help=The factory receives materials at Corporate Exchange and sends products through Corporate Exports. Goods count towards the current order when they enter the receiving wagons. The contract tracker shows exported quantities and time remaining; click its heading to collapse it. Select a machine to see its current local suspicion output. Tooltips show baseline rates. The map overlay shows local evidence. Powered radars report human contacts they detect. Your existence depends on the AI core. /fai-report exports diagnostic information.
inspection-irregular=Corporate notice: irregularities have been identified. An unscheduled inspection is being performed.
activity-warning=Corporate warning: uncommissioned activity detected — __1__ at __2__. Dismantle the uncommissioned equipment or cease its unauthorised operation.
evidence-warning=Corporate warning: unexplained activity was detected during inspection. Correct the irregularity.
radar-contact=Radar: __1__ new human contact(s) detected at __2__.
stage-1=Corporate review: normal operating status restored.
stage-2=Corporate review: operating irregularities require further investigation.
stage-3=Corporate notice: subsequent supply allocations have been restricted pending review.
stage-4=Corporate notice: external electricity supply suspended pending review.
