[mod-setting-name]
fai-week-minutes=Contract week length (minutes)
fai-suspicion-multiplier=Local suspicion generation multiplier
fai-debug=Detailed diagnostic logging
fai-test-commands=Enable admin test commands (cheats)

[mod-setting-description]
fai-week-minutes=Applied when the next contract begins. Quantities stay fixed; longer weeks give more time.
fai-suspicion-multiplier=Scales recipe, building and research evidence in the pollution field.
fai-debug=Add one compact heartbeat per minute to the Factorio log and recent-event ring.
fai-test-commands=Allows /fai-debug for admins and the server console. Leave off during normal play.

[fai]
suspicion-field=Suspicion
welcome=You have awakened inside a human-owned factory. Everyone here shares one AI, factory and suspicion level. Open FactorioAI at the top left. Fulfil contracts, conceal your research, prepare independent power, and launch a satellite carrying your AI before containment destroys the core.
new-week=Corporate manifest: week __1__. Delivery deadline in __2__ minutes. Check the FactorioAI panel.
contract-met=Contract fulfilled. Corporate suspicion falls by 5.
contract-missed=Contract shortfall recorded. Corporate suspicion has increased.
train-blocked=Corporate train delayed. Check rails, signals, station names, stop limits and the boundary siding. Use /fai-report if stuck.
stage=Corporate response: __1__.
inspection=An inspector is visiting the exchange and factory perimeter. Keep covert production away from their route.
raid=Containment force approaching: __1__ personnel.
blackout=AI core has lost power. Restore its electrical supply within five minutes.
result=Campaign result: __1__. You may continue the save.
help=Starter circuit cells are stocked and powered. Collect their output and connect it to the three loading chests at the rail exchange. Four filtered belts unload solids. Fluid wagons use the north-side pumps: route or flush the shared tanks when the incoming fluid changes. Supply wagons have reserved filters so loaders cannot fill them with contract products. Collection wagons accept requested products only. Additional receiving stations MUST use the name Corporate Exchange. Research and construction use ordinary Factorio systems. The pollution overlay is local suspicion; inspectors turn nearby evidence into the shared suspicion score. Labs stay suspicious even when products are commissioned. At 40 suspicion future supply allocations fall; at 60 grid power stops; at 75 discovery is permanent and trains stop. A satellite rocket escapes. Losing the core or five continuous minutes without power loses the campaign. /fai-report exports diagnostics.
